name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for npm trusted publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; pin past it regardless of
      # what the runner's Node bundles.
      - run: npm install -g npm@latest
      - run: npm test
      # Skip if this version is already on the registry so re-run tags
      # no-op instead of failing on the publish conflict. npm view exits 0
      # with empty output for a missing version, so test the output.
      - run: |
          version="$(node -p "require('./package.json').version")"
          if [ -n "$(npm view "roottrace-apm@$version" version 2>/dev/null || true)" ]; then
            echo "roottrace-apm@$version already published — skipping"
          else
            npm publish
          fi
